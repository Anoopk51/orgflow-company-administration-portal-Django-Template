{% extends "base.html" %}

{% block title %}Manage Team Members | OrgFlow{% endblock %}

{% block content %}

<div class="card-panel" style="max-width: 600px; margin: 0 auto;">

    <h2 class="mb-4">
        <i class="bi bi-people"></i> Manage Members &mdash; {{ team.name }}
    </h2>

    <form method="post">

        {% csrf_token %}

        {{ form.non_field_errors }}

        {{ form.as_p }}

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">
                Save Members
            </button>
            <a href="{% url 'team_detail' team.id %}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
