{% extends "base.html" %}

{% block title %}Activate Team | OrgFlow{% endblock %}

{% block content %}

<div class="card-panel" style="max-width: 600px; margin: 0 auto;">

    <h2 class="mb-4 text-success">
        <i class="bi bi-check-circle-fill"></i> Activate Team
    </h2>

    <div class="alert alert-info">
        <p class="mb-0">
            Are you sure you want to activate
            <strong>{{ team.name }}</strong>?
        </p>
    </div>

    <form method="post">

        {% csrf_token %}

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="bi bi-check-circle"></i> Confirm Activate
            </button>
            <a href="{% url 'team_detail' team.id %}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
