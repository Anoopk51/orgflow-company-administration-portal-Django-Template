{% extends "base.html" %}

{% block title %}Create Department | OrgFlow{% endblock %}

{% block content %}

<div class="card-panel" style="max-width: 600px; margin: 0 auto;">

    <h2 class="mb-4">
        <i class="bi bi-building-add"></i> Create Department
    </h2>

    <form method="post">

        {% csrf_token %}

        {{ form.non_field_errors }}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary mt-3">
            Create Department
        </button>

    </form>

</div>

{% endblock %}
