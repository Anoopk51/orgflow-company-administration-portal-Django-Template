{% extends "base.html" %}

{% block title %}Delete Task | OrgFlow{% endblock %}

{% block content %}

<div class="card-panel" style="max-width: 600px; margin: 0 auto;">

    <h2 class="mb-4 text-danger">
        <i class="bi bi-trash-fill"></i> Delete Task
    </h2>

    <div class="alert alert-danger">
        <p class="mb-0">
            Are you sure you want to delete
            <strong>{{ task.title }}</strong>? This action cannot be undone.
        </p>
    </div>

    <form method="post">

        {% csrf_token %}

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash"></i> Confirm Delete
            </button>
            <a href="{% url 'task_detail' task.id %}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
