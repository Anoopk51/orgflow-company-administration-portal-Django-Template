{% extends "base.html" %}

{% block title %}Edit My Profile | OrgFlow{% endblock %}

{% block content %}

<div class="card-panel" style="max-width: 700px; margin: 0 auto;">

    <h2 class="mb-4">Edit My Profile</h2>

    <form method="post" enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.non_field_errors }}

        {{ form.as_p }}

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>
            <a href="{% url 'my_profile' %}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
